<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Watch the Indore iBus demo video">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11321f"/>
      <stop offset="100%" stop-color="#0f7b52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="400" rx="14" fill="url(#bg)"/>

  <text x="56" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">
    🚌 Indore iBus — demo
  </text>
  <text x="56" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#bfe3d0">
    Booking a city bus ticket entirely inside WhatsApp
  </text>

  <g font-family="SFMono-Regular, Consolas, monospace" font-size="17" fill="#d9f2e4">
    <text x="56" y="200">you › hi</text>
    <text x="56" y="228">bot › 1 Book  2 My tickets  3 Cancel  4 Fare</text>
    <text x="56" y="256">you › 1 · palasia · vijay ngr</text>
    <text x="56" y="284">bot › ₹5 × 2 = ₹10 — reply YES</text>
    <text x="56" y="312" fill="#7ef0b4">bot › ✅ PNR IBH7YM4W</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="800" cy="212" r="62" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M782 180 L834 212 L782 244 Z" fill="#0f7b52"/>
  </g>
  <text x="800" y="310" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">
    Watch the demo
  </text>

  <text x="56" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8fc9ab">
    Django 5.2 · Twilio · Ngrok · MySQL · REST API · 98 tests
  </text>
</svg>
