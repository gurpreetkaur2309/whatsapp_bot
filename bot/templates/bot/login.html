{% extends "bot/base.html" %}
{% block title %}Login — Indore iBus{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:420px">
  <h1 class="h3 mb-4">Login</h1>
  <form method="post" class="card border-0 shadow-sm p-4">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="alert alert-danger">{{ form.non_field_errors.0 }}</div>
    {% endif %}
    <div class="mb-3">
      <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
      <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
      <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
    </div>
    <button class="btn btn-ib w-100">Login</button>
    <p class="text-center small mt-3 mb-0">No account? <a href="{% url 'register' %}">Register</a></p>
  </form>
</div>
{% endblock %}
